apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-config
data:
  app.name: "My Awesome App"
  app.environment: "development"
  nginx.conf: |
    server {
      listen 80;
      server_name localhost;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }